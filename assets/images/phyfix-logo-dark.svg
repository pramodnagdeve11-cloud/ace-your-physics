<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Text FIX Gradient -->
    <linearGradient id="fixGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Vertical Beam -->
    <linearGradient id="logoBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Subtle Bloom Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(10, 5)">
    <!-- ICON MARK (Center at x=40, y=40) -->
    <!-- Tilted Electron Orbit 1 -->
    <g transform="translate(40, 40) rotate(-35) translate(-40, -40)">
      <ellipse cx="40" cy="40" rx="36" ry="14" fill="none" stroke="url(#logoGrad)" stroke-width="2.2" stroke-dasharray="3 2" opacity="0.85"/>
      <circle cx="76" cy="40" r="3" fill="#00f2fe"/>
    </g>

    <!-- Tilted Electron Orbit 2 -->
    <g transform="translate(40, 40) rotate(35) translate(-40, -40)">
      <ellipse cx="40" cy="40" rx="36" ry="14" fill="none" stroke="url(#logoGrad)" stroke-width="2.2" opacity="0.85"/>
      <circle cx="4" cy="40" r="3" fill="#a855f7"/>
    </g>

    <!-- Central Phi (Φ) Ring -->
    <circle cx="40" cy="40" r="20" fill="none" stroke="url(#logoGrad)" stroke-width="4.2" filter="url(#logoGlow)"/>

    <!-- Vertical Beam (Φ Axis) -->
    <line x1="40" y1="8" x2="40" y2="72" stroke="url(#logoBeam)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="40" cy="8" r="2.5" fill="#00f2fe"/>
    <circle cx="40" cy="72" r="2.5" fill="#818cf8"/>

    <!-- Quantum Core -->
    <circle cx="40" cy="40" r="6.5" fill="url(#logoGrad)"/>
    <circle cx="40" cy="40" r="2.8" fill="#ffffff"/>
  </g>

  <!-- WORDMARK: PHYFIX -->
  <!-- "PHY" in crisp clean color -->
  <text x="104" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5" fill="#ffffff">PHY</text>

  <!-- "FIX" in glowing gradient -->
  <text x="194" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5" fill="url(#fixGrad)" filter="url(#logoGlow)">FIX</text>

  <!-- Small Quantum Dot on the I -->
  <circle cx="218.5" cy="22" r="3.2" fill="#00f2fe" filter="url(#logoGlow)"/>

  <!-- TAGLINE: ACE YOUR PHYSICS -->
  <text x="106" y="72" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="4.5" fill="#38bdf8" opacity="0.95">ACE YOUR PHYSICS</text>

  <!-- Decorative Separator Dot & Mentorship subtext -->
  <circle cx="282" cy="69" r="1.8" fill="#818cf8"/>
  <text x="290" y="72" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#94a3b8">1-ON-1</text>
</svg>