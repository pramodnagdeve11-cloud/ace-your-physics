<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1022"/>
      <stop offset="50%" stop-color="#0e172f"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Vibrant Brand Cyan/Blue/Violet Gradient -->
    <linearGradient id="phyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Accent Beam Gradient -->
    <linearGradient id="beamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Glow Filter for Ambient Bloom -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Squircle Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Radial Ambient Light Behind Symbol -->
  <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
    <stop offset="45%" stop-color="#6366f1" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#070c18" stop-opacity="0"/>
  </radialGradient>
  <circle cx="256" cy="256" r="190" fill="url(#centerAura)"/>

  <!-- Dynamic Electron Orbital 1 (Tilted -35 deg) -->
  <g transform="translate(256, 256) rotate(-35) translate(-256, -256)" filter="url(#softGlow)">
    <ellipse cx="256" cy="256" rx="168" ry="62" fill="none" stroke="url(#phyGrad)" stroke-width="6" stroke-dasharray="8 6" opacity="0.85"/>
    <!-- Orbiting Electron Node 1 -->
    <circle cx="424" cy="256" r="10" fill="#00f2fe" filter="url(#coreGlow)"/>
    <circle cx="424" cy="256" r="4" fill="#ffffff"/>
  </g>

  <!-- Dynamic Electron Orbital 2 (Tilted +35 deg) -->
  <g transform="translate(256, 256) rotate(35) translate(-256, -256)" filter="url(#softGlow)">
    <ellipse cx="256" cy="256" rx="168" ry="62" fill="none" stroke="url(#phyGrad)" stroke-width="6" opacity="0.85"/>
    <!-- Orbiting Electron Node 2 -->
    <circle cx="88" cy="256" r="10" fill="#a855f7" filter="url(#coreGlow)"/>
    <circle cx="88" cy="256" r="4" fill="#ffffff"/>
  </g>

  <!-- Central Phi (Φ) Ring -->
  <circle cx="256" cy="256" r="92" fill="none" stroke="url(#phyGrad)" stroke-width="16" filter="url(#softGlow)"/>

  <!-- Vertical Phi Axis Line / Light Beam (Fix Vector) -->
  <line x1="256" y1="96" x2="256" y2="416" stroke="url(#beamGrad)" stroke-width="14" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Precision Crosshair Node Accents (Fix / Precision Concept) -->
  <circle cx="256" cy="96" r="9" fill="#00f2fe" filter="url(#coreGlow)"/>
  <circle cx="256" cy="416" r="9" fill="#818cf8" filter="url(#coreGlow)"/>

  <!-- Central Glowing Quantum Nucleus -->
  <circle cx="256" cy="256" r="28" fill="url(#phyGrad)" filter="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>

  <!-- Subtle Photon / Energy Sparks -->
  <polygon points="256,218 261,232 275,237 261,242 256,256 251,242 237,237 251,232" fill="#00f2fe" opacity="0.9"/>
</svg>